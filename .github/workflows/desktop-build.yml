# ══════════════════════════════════════════════════════════════════════════
#  AKANSHA — cross-platform desktop builds
#
#  Honest purpose: the macOS .dmg and Linux .AppImage/.deb CANNOT be produced
#  on a Windows machine. This workflow builds each platform on the correct
#  runner so the "all formats" artifacts are produced where they actually can
#  be. It uploads them as workflow ARTIFACTS only.
#
#  It deliberately does NOT create or publish a GitHub Release and does NOT
#  sign / notarize / code-sign anything:
#    - Windows Authenticode signing  requires a code-signing cert (secret).
#    - macOS .dmg notarization        requires an Apple Developer ID + API key
#                                      (secrets) and can only run on macOS.
#    - Android release (AAB) signing  requires YOUR upload keystore (secret).
#  Those stay human-gated on purpose. Enable them only by adding the secrets
#  and flipping the `if` guards below.
#
#  Trigger: manual (workflow_dispatch) or on version tags v* — NOT every push,
#  so a deploy push does not silently kick off heavy builds.
# ══════════════════════════════════════════════════════════════════════════
name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Windows (NSIS + Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: akansha-windows
          path: |
            release/Akansha-Setup-*.exe
            release/Akansha-Portable-*.exe
          if-no-files-found: error

  macos:
    name: macOS (dmg — unsigned unless secrets present)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Unsigned build; add Apple Developer ID cert + notary credentials as
      # secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
      # APPLE_TEAM_ID) to produce a notarized, installable .dmg.
      - run: npm run dist:mac
        env:
          CSC_LINK: ${{ secrets.APPLE_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: akansha-macos
          path: release/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: akansha-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  android:
    name: Android (debug APK — release AAB needs your keystore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap add android || true
      - run: npx cap sync android
      # Debug build only. A signed, Play-uploadable AAB needs YOUR upload
      # keystore as a secret (ANDROID_KEYSTORE, keystore passwords) — not faked here.
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: akansha-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
