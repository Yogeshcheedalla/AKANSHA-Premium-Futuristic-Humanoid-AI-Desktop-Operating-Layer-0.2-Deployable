<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Hosted-origin shell: this local file is a dormant fallback only. Capacitor's
         Bridge loads server.url (the production origin) directly at startup, so this page
         is normally never shown. If it ever is (server.url missing/offline), it forwards to
         the real Akansha landing rather than stranding the user on a fake offline page. -->
    <meta http-equiv="refresh" content="0; url=https://akansha-gamma.vercel.app" />
    <title>Akansha</title>
    <style>
      html,body{margin:0;height:100%;background:#010208;color:#8be9fd;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
      .box{text-align:center;opacity:.85}
      .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00f0ff;margin-right:8px;animation:p 1.6s infinite}
      @keyframes p{50%{opacity:.3}}
    </style>
  </head>
  <body>
    <div class="box"><span class="dot"></span>Opening Akansha…</div>
    <script>
      // Forward to the canonical hosted origin (never a local/offline landing).
      var ORIGIN = 'https://akansha-gamma.vercel.app';
      try { if (window.location.href.indexOf(ORIGIN) !== 0) { window.location.replace(ORIGIN); } } catch (e) {}
    </script>
  </body>
</html>
