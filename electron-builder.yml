# ═══════════════════════════════════════════════════════════
#  AKANSHA — Electron Builder (real Windows desktop installer)
#
#  Produces:
#    release/Akansha-Setup-<version>.exe      (NSIS installer)
#    release/Akansha-Portable-<version>.exe   (portable)
#
#  The packaged app bundles the Next.js production build + its
#  Node runtime (via Electron), so the end user needs NO git,
#  NO Node, NO npm, and never opens a browser.
#
#  Build:  npm run dist:win
# ═══════════════════════════════════════════════════════════

appId: ai.akansha.desktop
productName: Akansha
copyright: Copyright © Akansha

directories:
  output: release
  buildResources: build

# Next.js `next start` reads real files from disk, so the app must NOT be
# packed into an asar archive.
asar: false

# What ships inside the app bundle (production node_modules is included by
# default by electron-builder; these are the application files).
files:
  - .next/**/*
  - "!**/.next/dev/**"
  - "!**/.next/standalone/**"
  - "!**/.next/cache/**"
  - electron/**/*
  - public/**/*
  - package.json
  - "!public/downloads/*.exe"
  - "!**/*.map"
  - "!**/{.cache,tmp,temp}/**"

extraMetadata:
  main: electron/main.js

# Bundle a provisioned inference runtime (llama.cpp) into the packaged app so the
# Model Center can run REAL local inference offline. Operator/build step: drop the
# llama.cpp Windows distribution at runtime/llama/ (llama-cli.exe + its DLLs) before
# `npm run dist:win`; the app discovers it via process.resourcesPath/runtime/llama.
# An empty runtime/ dir simply means no offline runtime is offered — never assumed.
extraResources:
  - from: runtime
    to: runtime
    filter: ["**/*"]

# ─────────── WINDOWS ───────────
# build/icon.png (>= 256x256) is converted to .ico automatically by electron-builder.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: Akansha-Setup-${version}.${ext}
  requestedExecutionLevel: asInvoker
  # Skip signing/rcedit so the build does not require the winCodeSign toolset
  # (which cannot be extracted in non-admin / no-Developer-Mode environments).
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Akansha
  deleteAppDataOnUninstall: false
  artifactName: Akansha-Setup-${version}.${ext}
  uninstallDisplayName: Akansha

portable:
  artifactName: Akansha-Portable-${version}.${ext}

# ─────────── macOS ───────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: build/icon.png
  artifactName: Akansha-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false

# ─────────── Linux ───────────
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  artifactName: Akansha-${version}-${arch}.${ext}

# Auto-update: disabled until a signed release feed is configured.
publish: null
